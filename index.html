<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D-Laderaumplanung für LKW</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #121a2c;
        --panel-light: #1b2641;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #111b32, var(--bg) 60%);
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(300px, 420px) 1fr;
      }

      .sidebar {
        background: color-mix(in oklab, var(--panel), #000 12%);
        border-right: 1px solid #24304e;
        padding: 1rem;
        overflow: auto;
      }

      .card {
        background: var(--panel-light);
        border: 1px solid #2b3757;
        border-radius: 12px;
        padding: 0.85rem;
        margin-bottom: 0.85rem;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
      }

      h2 {
        margin: 0 0 0.6rem;
        font-size: 0.95rem;
        color: #cbd5e1;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .sub {
        margin: 0;
        color: var(--muted);
        line-height: 1.35;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
      }

      label {
        display: block;
        font-size: 0.8rem;
        margin-bottom: 0.22rem;
        color: #cbd5e1;
      }

      input,
      select,
      button {
        width: 100%;
        border: 1px solid #3b4a70;
        border-radius: 9px;
        background: #0f1729;
        color: #e2e8f0;
        padding: 0.48rem 0.58rem;
        font: inherit;
      }

      button {
        cursor: pointer;
        background: linear-gradient(180deg, #2563eb, #1d4ed8);
        border: 1px solid #2d61cf;
        font-weight: 600;
      }

      button.secondary {
        background: linear-gradient(180deg, #374151, #1f2937);
        border-color: #4b5563;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
        margin-top: 0.55rem;
      }

      .metrics {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.4rem;
        font-size: 0.9rem;
      }

      .pill {
        display: flex;
        justify-content: space-between;
        background: #0f1729;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 0.42rem 0.56rem;
      }

      .pill strong.ok {
        color: var(--accent);
      }

      .pill strong.warn {
        color: var(--warn);
      }

      .pill strong.danger {
        color: var(--danger);
      }

      #cargo-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.35rem;
      }

      #cargo-list li {
        font-size: 0.84rem;
        background: #0f1729;
        border: 1px solid #2d3b5d;
        border-radius: 8px;
        padding: 0.4rem 0.5rem;
      }

      #viewport {
        min-height: 100vh;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        #viewport {
          min-height: 56vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="card">
          <h1>3D-Laderaumplanung</h1>
          <p class="sub">
            Plane schnell die Beladung für gängige LKW-Typen. Das System prüft
            Gewichtsgrenzen, Stapelregeln und visualisiert die Belegung live in 3D.
          </p>
        </div>

        <section class="card">
          <h2>1) LKW wählen</h2>
          <label for="truck">LKW-Typ</label>
          <select id="truck"></select>
        </section>

        <section class="card">
          <h2>2) Ladegut anlegen</h2>
          <div class="grid-2">
            <div>
              <label for="name">Bezeichnung</label>
              <input id="name" value="Palette" />
            </div>
            <div>
              <label for="weight">Gewicht (kg)</label>
              <input id="weight" type="number" min="1" value="500" />
            </div>
            <div>
              <label for="length">Länge (m)</label>
              <input id="length" type="number" step="0.1" min="0.2" value="1.2" />
            </div>
            <div>
              <label for="width">Breite (m)</label>
              <input id="width" type="number" step="0.1" min="0.2" value="0.8" />
            </div>
            <div>
              <label for="height">Höhe (m)</label>
              <input id="height" type="number" step="0.1" min="0.2" value="1.2" />
            </div>
            <div>
              <label for="stack">Max. stapelbar</label>
              <input id="stack" type="number" min="1" value="2" />
            </div>
          </div>
          <label style="margin-top: 0.55rem" for="nonStackable">
            <input id="nonStackable" type="checkbox" style="width: auto; margin-right: 0.35rem" />
            Nicht stapelbar
          </label>
          <div class="actions">
            <button id="add">Ladegut hinzufügen</button>
            <button class="secondary" id="fill">Mit Euro-Paletten füllen</button>
          </div>
        </section>

        <section class="card">
          <h2>3) Status</h2>
          <div class="metrics" id="metrics"></div>
        </section>

        <section class="card">
          <h2>Ladeeinheiten</h2>
          <ul id="cargo-list"></ul>
          <div class="actions">
            <button class="secondary" id="reset">Planung zurücksetzen</button>
          </div>
        </section>
      </aside>
      <section id="viewport" aria-label="3D-Ansicht des Laderaums"></section>
    </main>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.163.0/build/three.module.js';
      import { OrbitControls } from 'https://unpkg.com/three@0.163.0/examples/jsm/controls/OrbitControls.js';

      const trucks = [
        { id: 'sattel-standard', name: 'Sattelzug Standard (13,6 m)', l: 13.6, w: 2.45, h: 2.7, maxPayload: 24000 },
        { id: 'sattel-mega', name: 'Sattelzug Mega (13,6 m / 3,0 m innen)', l: 13.6, w: 2.48, h: 3.0, maxPayload: 24000 },
        { id: 'wechsler-18', name: 'Wechselbrücke 18 t', l: 7.15, w: 2.45, h: 2.6, maxPayload: 12000 },
        { id: 'motorwagen', name: 'Motorwagen 12 t', l: 6.1, w: 2.45, h: 2.5, maxPayload: 7000 },
      ];

      const state = {
        truck: trucks[0],
        items: [],
        placed: [],
      };

      const els = {
        truck: document.getElementById('truck'),
        name: document.getElementById('name'),
        weight: document.getElementById('weight'),
        length: document.getElementById('length'),
        width: document.getElementById('width'),
        height: document.getElementById('height'),
        stack: document.getElementById('stack'),
        nonStackable: document.getElementById('nonStackable'),
        add: document.getElementById('add'),
        fill: document.getElementById('fill'),
        reset: document.getElementById('reset'),
        metrics: document.getElementById('metrics'),
        cargoList: document.getElementById('cargo-list'),
        viewport: document.getElementById('viewport'),
      };

      let scene;
      let camera;
      let renderer;
      let controls;
      let truckGroup;
      let cargoGroup;

      function setupTruckSelect() {
        trucks.forEach((truck) => {
          const option = document.createElement('option');
          option.value = truck.id;
          option.textContent = truck.name;
          els.truck.appendChild(option);
        });
      }

      function initThree() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1020);

        camera = new THREE.PerspectiveCamera(55, els.viewport.clientWidth / els.viewport.clientHeight, 0.1, 200);
        camera.position.set(16, 10, 12);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(els.viewport.clientWidth, els.viewport.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        els.viewport.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.4, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const key = new THREE.DirectionalLight(0xffffff, 1.2);
        key.position.set(10, 14, 7);
        scene.add(key);

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(60, 60),
          new THREE.MeshStandardMaterial({ color: 0x141b2d, roughness: 0.95 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        scene.add(floor);

        const grid = new THREE.GridHelper(60, 60, 0x334155, 0x1e293b);
        scene.add(grid);

        truckGroup = new THREE.Group();
        cargoGroup = new THREE.Group();
        scene.add(truckGroup);
        scene.add(cargoGroup);

        window.addEventListener('resize', onResize);
        animate();
      }

      function onResize() {
        camera.aspect = els.viewport.clientWidth / els.viewport.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(els.viewport.clientWidth, els.viewport.clientHeight);
      }

      function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function clearGroup(group) {
        while (group.children.length) {
          const child = group.children.pop();
          child.geometry?.dispose?.();
          if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose?.());
          else child.material?.dispose?.();
        }
      }

      function drawTruck() {
        clearGroup(truckGroup);
        const { l, w, h } = state.truck;

        const bounds = new THREE.Mesh(
          new THREE.BoxGeometry(l, h, w),
          new THREE.MeshStandardMaterial({ color: 0x1d4ed8, transparent: true, opacity: 0.08 })
        );
        bounds.position.set(0, h / 2, 0);

        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(l, h, w)),
          new THREE.LineBasicMaterial({ color: 0x60a5fa })
        );
        edges.position.copy(bounds.position);

        truckGroup.add(bounds, edges);
        controls.target.set(0, h / 2, 0);
      }

      function collides(a, b) {
        return (
          Math.abs(a.x - b.x) * 2 < a.l + b.l &&
          Math.abs(a.y - b.y) * 2 < a.h + b.h &&
          Math.abs(a.z - b.z) * 2 < a.w + b.w
        );
      }

      function canBePlaced(item, pos, placements, totalWeight) {
        const { l, w, h, maxPayload } = state.truck;

        if (pos.x - item.l / 2 < -l / 2 || pos.x + item.l / 2 > l / 2) return false;
        if (pos.z - item.w / 2 < -w / 2 || pos.z + item.w / 2 > w / 2) return false;
        if (pos.y + item.h / 2 > h) return false;
        if (totalWeight + item.weight > maxPayload) return false;

        const candidate = { ...item, ...pos };
        for (const placed of placements) {
          if (collides(candidate, placed)) return false;
        }

        if (pos.y > item.h / 2 + 0.01) {
          const supported = placements.find((p) => {
            const top = p.y + p.h / 2;
            const touchesTop = Math.abs(top - (pos.y - item.h / 2)) < 0.06;
            const overlapX = Math.abs(p.x - pos.x) * 2 < p.l + item.l - 0.05;
            const overlapZ = Math.abs(p.z - pos.z) * 2 < p.w + item.w - 0.05;
            return touchesTop && overlapX && overlapZ;
          });

          if (!supported || supported.nonStackable) return false;

          const stackLevel = placements.filter(
            (p) => Math.abs(p.x - supported.x) < 0.05 && Math.abs(p.z - supported.z) < 0.05 && p.y <= supported.y
          ).length;
          if (stackLevel >= supported.maxStack) return false;
        }

        return true;
      }

      function autoPlaceItems(items) {
        const placements = [];
        let totalWeight = 0;
        const { l, w } = state.truck;

        const sorted = [...items].sort((a, b) => b.weight - a.weight);

        for (const item of sorted) {
          let placed = false;
          const xStep = Math.max(0.2, Math.min(item.l, 0.6));
          const zStep = Math.max(0.2, Math.min(item.w, 0.6));
          const yStep = Math.max(0.2, Math.min(item.h, 0.6));

          for (let y = item.h / 2; y <= state.truck.h - item.h / 2 + 0.001 && !placed; y += yStep) {
            for (let x = -l / 2 + item.l / 2; x <= l / 2 - item.l / 2 + 0.001 && !placed; x += xStep) {
              for (let z = -w / 2 + item.w / 2; z <= w / 2 - item.w / 2 + 0.001 && !placed; z += zStep) {
                const pos = { x: Number(x.toFixed(3)), y: Number(y.toFixed(3)), z: Number(z.toFixed(3)) };
                if (canBePlaced(item, pos, placements, totalWeight)) {
                  placements.push({ ...item, ...pos });
                  totalWeight += item.weight;
                  placed = true;
                }
              }
            }
          }
        }
        return placements;
      }

      function renderCargo() {
        clearGroup(cargoGroup);
        const palette = [0x22c55e, 0xf97316, 0x8b5cf6, 0x06b6d4, 0xf43f5e, 0xeab308];

        state.placed.forEach((item, i) => {
          const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(item.l, item.h, item.w),
            new THREE.MeshStandardMaterial({ color: palette[i % palette.length], roughness: 0.4 })
          );
          mesh.position.set(item.x, item.y, item.z);
          cargoGroup.add(mesh);
        });
      }

      function formatKg(v) {
        return `${Math.round(v).toLocaleString('de-DE')} kg`;
      }

      function updateMetrics() {
        const usedWeight = state.placed.reduce((sum, i) => sum + i.weight, 0);
        const weightRatio = usedWeight / state.truck.maxPayload;

        const volume = state.truck.l * state.truck.w * state.truck.h;
        const usedVolume = state.placed.reduce((sum, i) => sum + i.l * i.w * i.h, 0);
        const volRatio = usedVolume / volume;

        const notPlaced = state.items.length - state.placed.length;

        els.metrics.innerHTML = `
          <div class="pill"><span>Nutzlast</span><strong class="${weightRatio > 1 ? 'danger' : weightRatio > 0.85 ? 'warn' : 'ok'}">${formatKg(usedWeight)} / ${formatKg(state.truck.maxPayload)}</strong></div>
          <div class="pill"><span>Volumen</span><strong class="${volRatio > 0.92 ? 'warn' : 'ok'}">${(volRatio * 100).toFixed(1)}%</strong></div>
          <div class="pill"><span>Geladen</span><strong class="ok">${state.placed.length} / ${state.items.length}</strong></div>
          <div class="pill"><span>Nicht platzierbar</span><strong class="${notPlaced ? 'warn' : 'ok'}">${notPlaced}</strong></div>
        `;
      }

      function updateCargoList() {
        els.cargoList.innerHTML = '';
        state.items.forEach((item, idx) => {
          const li = document.createElement('li');
          li.textContent = `${idx + 1}. ${item.name}: ${item.l}×${item.w}×${item.h} m, ${formatKg(item.weight)}, Stapelbar: ${item.nonStackable ? 'Nein' : `bis ${item.maxStack} Ebenen`}`;
          els.cargoList.appendChild(li);
        });
      }

      function recomputePlan() {
        state.placed = autoPlaceItems(state.items);
        renderCargo();
        updateMetrics();
        updateCargoList();
      }

      function readItemForm() {
        const name = els.name.value.trim() || 'Ladegut';
        const weight = Number(els.weight.value);
        const l = Number(els.length.value);
        const w = Number(els.width.value);
        const h = Number(els.height.value);
        const maxStack = Math.max(1, Number(els.stack.value || 1));
        const nonStackable = els.nonStackable.checked;

        if ([weight, l, w, h].some((v) => !Number.isFinite(v) || v <= 0)) {
          window.alert('Bitte gültige positive Zahlen eingeben.');
          return null;
        }

        return { name, weight, l, w, h, maxStack, nonStackable };
      }

      function setTruckById(id) {
        const truck = trucks.find((t) => t.id === id);
        if (!truck) return;
        state.truck = truck;
        drawTruck();
        recomputePlan();
      }

      function bindEvents() {
        els.truck.addEventListener('change', (e) => setTruckById(e.target.value));

        els.add.addEventListener('click', () => {
          const item = readItemForm();
          if (!item) return;
          state.items.push(item);
          recomputePlan();
        });

        els.fill.addEventListener('click', () => {
          const euro = { name: 'Euro-Palette', weight: 550, l: 1.2, w: 0.8, h: 1.25, maxStack: 2, nonStackable: false };
          state.items = Array.from({ length: 34 }, () => ({ ...euro }));
          recomputePlan();
        });

        els.reset.addEventListener('click', () => {
          state.items = [];
          recomputePlan();
        });
      }

      setupTruckSelect();
      initThree();
      bindEvents();
      setTruckById(trucks[0].id);
    </script>
  </body>
</html>
